# Render deployment for www.rijisha.com
#
# NOTE: the live service (Rijisha-Jewels, srv-d9if39naqgkc73a0i3d0) was created
# through the dashboard, not from this file, and its settings have drifted from
# it — the live service runs in Oregon on the free plan with no health check
# path. Editing this file therefore does NOT change the live service. Until the
# service is adopted as a Blueprint, treat the dashboard as the source of truth
# and mirror any change here by hand.
#
# One web service runs the API and serves the built storefront from the same
# origin, so the browser never makes a cross-origin request.
#
# Values marked "sync: false" are NOT stored here — set them in the Render
# dashboard under Environment. Never commit secrets to this file.

services:
  - type: web
    name: rijisha
    runtime: node
    plan: free # switch to "starter" before promoting the shop — free sleeps after 15 min idle
    region: singapore # closest to customers in India
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Atlas connection string — must point at the PRODUCTION database,
      # not the one local development writes to.
      - key: MONGO_URI
        sync: false

      # Generated once by Render. Changing it logs every customer out.
      - key: JWT_SECRET
        generateValue: true

      # Admin panel login. No defaults exist in the code, so the server will
      # refuse to boot until these are set.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Where password reset links point. Never derived from the request Host
      # header, which a caller can forge — so it must be set here.
      - key: PUBLIC_URL
        value: https://www.rijisha.com

      # Password reset email goes through Resend's HTTPS API. Free instances
      # block outbound SMTP (ports 25/465/587), so nodemailer cannot deliver
      # from here at all — this key is what makes account recovery work.
      - key: RESEND_API_KEY
        sync: false

      # SMTP is the fallback transport, used only when RESEND_API_KEY is empty.
      # Leave these unset on Render; they exist for local development and for a
      # future host that permits outbound SMTP.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # Cloudinary holds product photos, collection images and review photos.
      # This instance's own disk is rebuilt on every deploy and on every wake
      # from sleep, so anything stored there is lost — these are what keep
      # uploaded images alive.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
